url: ~
template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html

home:
  sidebar:
    structure: [links, license, citation, authors, dev]
  links:
  - text: MiRA (the visualizer)
    href: https://mira.ecomplab.com/
  - text: emln (multilayer networks in R)
    href: https://emln.ecomplab.com/
  - text: Report a bug
    href: https://github.com/Ecological-Complexity-Lab/ggmira/issues

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: "Developed by the [Ecological Complexity Lab](https://ecomplab.com)."

reference:
- title: Plot basics
  desc: Start a plot from a multilayer network, see what it sends to MiRA, and open it in the browser.
  contents:
  - mira
  - mira_spec
  - print.mira_plot
- title: "Elements: nodes, links, layers"
  desc: >
    One component per element of the plot. `color_by` and `size_by` map an
    attribute of the data; `color`, `size` and `shape` set constants.
  contents:
  - mira_node
  - mira_intralayer
  - mira_interlayer
  - mira_layer
- title: Scales
  desc: How data values become colors and sizes.
  contents:
  - mira_scales
- title: Layout
  desc: Where the nodes go.
  contents:
  - mira_layout
- title: Camera
  desc: How the stack of layers is looked at.
  contents:
  - mira_camera
- title: Legends
  desc: Which legends are open, and where.
  contents:
  - mira_legends
- title: "Data: what is drawn"
  desc: Draw only part of the network.
  contents:
  - mira_filter
- title: "Views: MiRA's modes"
  desc: >
    Open the plot in another view. A plot opens in one view; the other
    components still apply.
  contents:
  - mira_mode
  - mira_mode_grid
  - mira_mode_map
  - mira_mode_layer
  - mira_mode_meta
  - mira_mode_dashboard
  - mira_mode_data
- title: Opening a network with MiRA's defaults
  contents:
  - plot_mira

articles:
- title: Articles
  navbar: ~
  contents:
  - articles/getting-started
  - articles/beta-testing
